<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>JARVIS 2.0</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#07111e;color:#e8f7ff;font-family:Arial,sans-serif;padding:20px}

.container{max-width:850px;margin:30px auto;background:#0d1b2a;border:1px solid #174767;border-radius:20px;padding:25px;box-shadow:0 0 35px #087ca044}

h1{text-align:center;color:#56d9ff;letter-spacing:8px}

.status{text-align:center;color:#55d9a6;font-size:12px;letter-spacing:3px}

.circle{width:110px;height:110px;margin:25px auto;border:3px solid #36cfff;border-radius:50%;display:grid;place-items:center;font-size:40px;color:#56d9ff;box-shadow:0 0 30px #00bfff55}

h2{color:#56d9ff;font-size:17px}

#chat,.panel{background:#071421;border-radius:12px;padding:15px;margin:15px 0}

#chat{height:210px;overflow-y:auto}

.message{margin:12px 0;line-height:1.5;overflow-wrap:anywhere}

.user{color:#56d9ff}.jarvis{color:#55d9a6}

input,select{padding:12px;border-radius:8px;border:1px solid #26749a;background:#071421;color:white;font-size:14px}

input{width:65%;max-width:100%}

button{padding:12px 15px;margin:4px;border:0;border-radius:8px;background:#087ca8;color:white;cursor:pointer}

button:hover{background:#10a9d7}

.panel{margin-top:22px}

.item{padding:10px;border-bottom:1px solid #174767;line-height:1.5}

.small{font-size:12px;color:#9bb5c8}

.done{text-decoration:line-through;color:#78909c}

@media(max-width:550px){.container{padding:15px}input{width:100%}}

</style>

</head>

<body>

<div class="container">

<h1>J.A.R.V.I.S.</h1>

<div class="status" id="status">● SISTEMA 2.0 INICIADO</div>

<div class="circle">J</div>

<div id="chat">

<div class="message jarvis">JARVIS: Memoria avanzada inicializada. ¿Qué necesitas?</div>

</div>

<input id="message" placeholder="Escribe una orden...">

<button onclick="sendMessage()">Enviar</button>

<button onclick="listen()">🎙 Hablar</button>

<div class="panel">

<h2>🧠 Memoria personal</h2>

<div id="memory"></div>

<button onclick="showMemory()">Actualizar memoria</button>

</div>

<div class="panel">

<h2>📋 Tareas</h2>

<div id="tasks"></div>

</div>

<div class="panel">

<h2>📚 Proyectos</h2>

<div id="projects"></div>

</div>

<div class="small" style="text-align:center">JARVIS PERSONAL ASSISTANT · VERSION 2.0</div>

</div>

<script>

const chat=document.getElementById("chat");

const input=document.getElementById("message");

const statusText=document.getElementById("status");

function getData(key){

 try{return JSON.parse(localStorage.getItem(key)||"[]")}

 catch{return []}

}

function saveData(key,data){

 localStorage.setItem(key,JSON.stringify(data));

}

function addMessage(text,type){

 const div=document.createElement("div");

 div.className="message "+type;

 div.textContent=(type==="user"?"TÚ: ":"JARVIS: ")+text;

 chat.appendChild(div);

 chat.scrollTop=chat.scrollHeight;

}

function speak(text){

 if(!("speechSynthesis" in window))return;

 speechSynthesis.cancel();

 const voice=new SpeechSynthesisUtterance(text);

 voice.lang="es-ES";

 speechSynthesis.speak(voice);

}

function reply(text){

 addMessage(text,"jarvis");

 speak(text);

}

function showMemory(){

 const memories=getData("jarvis_memories");

 const oldNotes=getData("jarvis_notes");

 const area=document.getElementById("memory");

 area.textContent="";

 if(!memories.length&&!oldNotes.length){

  area.textContent="Todavía no hay recuerdos guardados.";

  return;

 }

 memories.forEach((m,i)=>{

  const div=document.createElement("div");

  div.className="item";

  div.textContent=(i+1)+". ["+m.category+"] "+m.text;

  area.appendChild(div);

 });

 oldNotes.forEach((n,i)=>{

  const div=document.createElement("div");

  div.className="item";

  div.textContent="Nota antigua "+(i+1)+": "+n;

  area.appendChild(div);

 });

}

function showTasks(){

 const area=document.getElementById("tasks");

 area.textContent="";

 const tasks=getData("jarvis_tasks");

 if(!tasks.length){area.textContent="No tienes tareas.";return}

 tasks.forEach((t,i)=>{

  const div=document.createElement("div");

  div.className="item"+(t.done?" done":"");

  div.textContent=(i+1)+". "+t.text+(t.done?" ✓":"");

  area.appendChild(div);

 });

}

function showProjects(){

 const area=document.getElementById("projects");

 area.textContent="";

 const projects=getData("jarvis_projects");

 if(!projects.length){area.textContent="No tienes proyectos.";return}

 projects.forEach((p,i)=>{

  const div=document.createElement("div");

  div.className="item";

  div.textContent=(i+1)+". "+p;

  area.appendChild(div);

 });

}

function refresh(){

 showMemory();showTasks();showProjects();

}

function sendMessage(){

 const text=input.value.trim();

 if(!text)return;

 input.value="";

 addMessage(text,"user");

 const command=text.toLowerCase();

 let response="Todavía no conozco esa orden. Prueba a decir AYUDA para ver mis comandos.";

if(command==="ayuda"||command.includes("qué puedes hacer")){

 response="Puedo guardar recuerdos, notas, tareas y proyectos. También puedo consultar la fecha y la hora. Di: guarda recuerdo categoría contenido, guarda tarea contenido o guarda proyecto contenido.";

}

else if(command.includes("hola")){

 response="Hola. Todos mis sistemas funcionan correctamente.";

}

else if(command.includes("hora")){

 response="Son las "+new Date().toLocaleTimeString("es-ES");

}

else if(command.includes("fecha")){

 response="Hoy es "+new Date().toLocaleDateString("es-ES");

}

else if(command.startsWith("guarda recuerdo ")){

 const content=text.substring(16).trim();

 const split=content.indexOf(" ");

 if(split<1){

  response="Indica una categoría y después el recuerdo. Por ejemplo: guarda recuerdo historia me interesa el Imperio español.";

 }else{

  const memories=getData("jarvis_memories");

  memories.push({category:content.substring(0,split),text:content.substring(split+1)});

  saveData("jarvis_memories",memories);

  response="Recuerdo guardado en mi memoria.";

 }

}

else if(command.startsWith("guarda nota ")){

 const note=text.substring(12).trim();

 if(note){

  const notes=getData("jarvis_notes");

  notes.push(note);saveData("jarvis_notes",notes);

  response="Nota guardada correctamente.";

 }else response="Dime qué nota quieres guardar.";

}

else if(command.includes("mis recuerdos")||command.includes("qué recuerdas")){

 const memories=getData("jarvis_memories");

 const notes=getData("jarvis_notes");

 response=memories.length||notes.length

 ? "Tengo "+memories.length+" recuerdos y "+notes.length+" notas antiguas guardadas. Puedes consultarlos en el panel de memoria."

 : "Todavía no tengo recuerdos guardados.";

}

else if(command.includes("mis notas")){

 const notes=getData("jarvis_notes");

 response=notes.length?"Tus notas son: "+notes.join(". "):"No tienes notas guardadas.";

}

else if(command.startsWith("guarda tarea ")){

 const task=text.substring(13).trim();

 if(task){

  const tasks=getData("jarvis_tasks");

  tasks.push({text:task,done:false});

  saveData("jarvis_tasks",tasks);

  response="Tarea añadida a tu lista.";

 }else response="¿Qué tarea quieres añadir?";

}

else if(command.includes("mis tareas")){

 const tasks=getData("jarvis_tasks");

 response=tasks.length?"Tienes "+tasks.filter(t=>!t.done).length+" tareas pendientes. Consulta el panel de tareas.":"No tienes tareas.";

}

else if(command.startsWith("completa tarea ")){

 const number=parseInt(command.substring(15).trim(),10);

 const tasks=getData("jarvis_tasks");

 if(number>=1&&number<=tasks.length){

  tasks[number-1].done=true;

  saveData("jarvis_tasks",tasks);

  response="Tarea "+number+" marcada como completada.";

 }else response="No encuentro esa tarea. Consulta primero tu lista.";

}

else if(command.startsWith("guarda proyecto ")){

 const project=text.substring(15).trim();

 if(project){

  const projects=getData("jarvis_projects");

  projects.push(project);saveData("jarvis_projects",projects);

  response="Proyecto guardado correctamente.";

 }else response="Dime el nombre del proyecto.";

}

else if(command.includes("mis proyectos")){

 const projects=getData("jarvis_projects");

 response=projects.length?"Tienes "+projects.length+" proyectos registrados. Consulta el panel de proyectos.":"Todavía no tienes proyectos.";

}

else if(command.startsWith("borra recuerdo ")){

 const number=parseInt(command.substring(14).trim(),10);

 const memories=getData("jarvis_memories");

 if(number>=1&&number<=memories.length){

  memories.splice(number-1,1);

  saveData("jarvis_memories",memories);

  response="Recuerdo eliminado.";

 }else response="No encuentro ese número de recuerdo.";

}

else if(command.startsWith("borra nota ")){

 const number=parseInt(command.substring(11).trim(),10);

 const notes=getData("jarvis_notes");

 if(number>=1&&number<=notes.length){

  notes.splice(number-1,1);saveData("jarvis_notes",notes);

  response="Nota eliminada.";

 }else response="No encuentro esa nota.";

}

setTimeout(()=>{reply(response);refresh()},250);

}

input.addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});

function listen(){

 const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;

 if(!Recognition){reply("El reconocimiento de voz no está disponible.");return}

 const recognition=new Recognition();

 recognition.lang="es-ES";

 recognition.interimResults=false;

 statusText.textContent="● ESCUCHANDO...";

 recognition.onresult=e=>{

  input.value=e.results[0][0].transcript;

  statusText.textContent="● SISTEMA 2.0 INICIADO";

  sendMessage();

 };

 recognition.onerror=()=>{

  statusText.textContent="● ERROR DE MICRÓFONO";

 };

 recognition.onend=()=>{

  if(statusText.textContent==="● ESCUCHANDO...")

   statusText.textContent="● SISTEMA 2.0 INICIADO";

 };

 recognition.start();

}

refresh();

</script>

</body>

</html>
